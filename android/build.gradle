apply plugin: 'com.android.application'

// Voluntary SOL tips. Recipient pubkey stays in gitignored local.properties.
// Documented sample value: TIP_RECIPIENT_PUBKEY. Optional keys: tip.rpc.url, tip.lamports.
def tipLocalProperties = new Properties()
def tipLocalPropertiesFile = rootProject.file('local.properties')
if (tipLocalPropertiesFile.exists()) {
    tipLocalPropertiesFile.withInputStream { tipLocalProperties.load(it) }
}
def tipSanitize = { String value ->
    return (value ?: '').replace('\\', '').replace('"', '').replace('\r', '').replace('\n', '').trim()
}
def tipRecipient = tipSanitize(tipLocalProperties.getProperty('tip.recipient.pubkey', ''))
def tipRpc = tipSanitize(tipLocalProperties.getProperty('tip.rpc.url', ''))
def tipLamports = tipSanitize(tipLocalProperties.getProperty('tip.lamports', '10000000,50000000,100000000'))
if (!tipLamports) {
    tipLamports = '10000000,50000000,100000000'
}

// Release signing stays in gitignored local.properties. Paths use forward slashes.
def releaseStoreFile = (tipLocalProperties.getProperty('release.store.file', '') ?: '').trim()
def releaseStorePassword = tipLocalProperties.getProperty('release.store.password', '') ?: ''
def releaseKeyAlias = (tipLocalProperties.getProperty('release.key.alias', '') ?: '').trim()
def releaseKeyPassword = tipLocalProperties.getProperty('release.key.password', '') ?: ''

android {
    namespace 'com.shatteredpixel.shatteredpixeldungeon.android'
    compileSdk appAndroidCompileSDK
    compileOptions.sourceCompatibility = compileOptions.targetCompatibility = appJavaCompatibility

    sourceSets.main.assets.srcDirs = [new File(project(':core').projectDir, "/src/main/assets")]

    androidResources {
        localeFilters += ['en', 'zh-rCN', 'ko', 'ru', 'es', 'pt', 'fr', 'de', 'zh-rTW', 'ja', 'pl',
                          'it', 'tr', 'vi', 'uk', 'id', 'cs', 'nl', 'sv', 'hu', 'fi', 'el', 'be', 'eo' ]
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        manifestPlaceholders = [appName:appName]
        applicationId appPackageName

        buildConfigField "String", "TIP_RECIPIENT", "\"${tipRecipient}\""
        buildConfigField "String", "TIP_RPC_URL", "\"${tipRpc}\""
        buildConfigField "String", "TIP_LAMPORTS", "\"${tipLamports}\""

        versionCode appVersionCode
        versionName appVersionName

        minSdkVersion appAndroidMinSDK
        targetSdkVersion appAndroidTargetSDK
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".indev"
            versionNameSuffix '-INDEV'
            buildConfigField "String", "TIP_CLUSTER", '"devnet"'
            buildConfigField "String", "TIP_DEFAULT_RPC", '"https://api.devnet.solana.com"'
            dependencies {
                debugImplementation project(':services:updates:debugUpdates')
                debugImplementation project(':services:news:debugNews')
            }
        }
        release {

            //These lines enable R8, which is a code shrinker/optimizer/obfuscator.
            //This makes release APKs smaller and more efficient, but also makes debugging trickier
            //as the information produced in stack traces must be de-obfuscated.
            //See here: https://developer.android.com/studio/build/shrink-code#decode-stack-trace
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "TIP_CLUSTER", '"mainnet"'
            buildConfigField "String", "TIP_DEFAULT_RPC", '"https://api.mainnet-beta.solana.com"'

            dependencies {
                releaseImplementation project(':services:updates:debugUpdates')
                releaseImplementation project(':services:news:debugNews')
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'packageRelease' || task.name == 'signReleaseBundle') {
        task.doFirst {
            def store = releaseStoreFile ? file(releaseStoreFile) : null
            if (store == null || !store.isFile() || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
                throw new GradleException('Release signing is not configured. Set release.store.file, release.store.password, release.key.alias, and release.key.password in local.properties.')
            }
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"

    // Apache-2.0. Kotlin stays in this module; :core does not see these types.
    // 2.2.0 stable asks for compileSdk 37, which AGP 9.1.0 does not recommend.
    // This build of the same client targets compileSdk 36.
    def solanaMwaVersion = '2.2.0-agp9-beta1'
    def solanaWeb3Version = '0.3.1'
    def solanaRpcVersion = '0.2.11'
    implementation "com.solanamobile:mobile-wallet-adapter-clientlib-ktx:$solanaMwaVersion"
    implementation "com.solanamobile:web3-solana:$solanaWeb3Version"
    implementation "com.solanamobile:web3-core:$solanaWeb3Version"
    implementation "com.solanamobile:rpc-solana:$solanaRpcVersion"
    implementation "com.solanamobile:rpc-core:$solanaRpcVersion"
    implementation "com.solanamobile:rpc-ktordriver:$solanaRpcVersion"
    implementation "io.github.funkatronics:multimult:0.2.6"
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}